name: Import sff_fixed89 CC0 source tree

on:
  push:
    branches:
      - agent/publish-sff-fixed89-cc0
    paths:
      - '.sff_import/**'
      - '.github/workflows/import-sff-fixed89.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: agent/publish-sff-fixed89-cc0
          fetch-depth: 0

      - name: Verify and unpack sff_fixed89
        shell: bash
        run: |
          test -f .sff_import/READY || exit 0
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64
          import hashlib
          import shutil
          import tempfile
          import zipfile

          repo = Path.cwd()
          stage = repo / ".sff_import"
          expected_parts = 9
          parts = sorted(stage.glob("part_*.b64"))
          if len(parts) != expected_parts:
              raise SystemExit(f"Expected {expected_parts} parts, found {len(parts)}")

          encoded = "".join(p.read_text(encoding="ascii").strip() for p in parts)
          archive_bytes = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(archive_bytes).hexdigest()
          expected = "3949ba009c662348f43411885bc60ac1df6ca7387c135b78f364b37ef9cf3aa2"
          if actual != expected:
              raise SystemExit(f"SHA-256 mismatch: {actual} != {expected}")

          destination = repo / "sff_fixed89"
          if destination.exists():
              shutil.rmtree(destination)

          with tempfile.TemporaryDirectory() as td:
              archive = Path(td) / "sff_fixed89.zip"
              archive.write_bytes(archive_bytes)
              extract = Path(td) / "extract"
              extract.mkdir()

              with zipfile.ZipFile(archive) as zf:
                  for info in zf.infolist():
                      member = PurePosixPath(info.filename)
                      if member.is_absolute() or ".." in member.parts:
                          raise SystemExit(f"Unsafe ZIP member: {info.filename}")
                  zf.extractall(extract)

              entries = list(extract.iterdir())
              source = entries[0] if len(entries) == 1 and entries[0].is_dir() else extract
              shutil.copytree(source, destination)

          readme = repo / "README.md"
          readme.write_text(
              "# MugenCC0UsefulLibs\n\n"
              "Reusable libraries and tooling for M.U.G.E.N-compatible projects, "
              "released under CC0 where the repository owner holds the relevant rights.\n\n"
              "## Libraries\n\n"
              "- [`sff_fixed89`](sff_fixed89/) — C89 SFF v1/v2 parser and sprite decoder; "
              "fixed-capacity, no heap, caller-owned buffers, PCX/PNG support.\n\n"
              "Each library carries its own documentation, license-scope notice, "
              "tests, and build instructions. Third-party formats, trademarks, "
              "characters, artwork, and corpus files remain the property of their owners.\n",
              encoding="utf-8",
          )

          shutil.rmtree(stage)
          workflow = repo / ".github/workflows/import-sff-fixed89.yml"
          workflow.unlink(missing_ok=True)
          PY

      - name: Commit imported source tree
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish sff_fixed89 v0.1.0 under CC0-1.0"
          git push origin HEAD:agent/publish-sff-fixed89-cc0
